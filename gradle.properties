group = com.claudecommenttasks
version = 1.0.0

# The IntelliJ Platform version the plugin is compiled against (latest stable at the time of writing).
platformVersion = 2026.3
# Oldest IDE build the plugin declares compatibility with (2026.2). Verified with verifyPlugin.
pluginSinceBuild = 262

# The platform bundles the Kotlin stdlib; do not ship our own copy -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = true
