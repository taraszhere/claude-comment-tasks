name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin zip
        run: ./gradlew buildPlugin --no-daemon --stacktrace

      - name: Create GitHub release with zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="build/distributions/${TAG}.zip"
          mv build/distributions/claude-comment-tasks-*.zip "$zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" \
              --title "$TAG" \
              --generate-notes
          fi